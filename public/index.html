<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XSLT 3.0 Fiddle</title>
<style>
  :root { --bd:#d5d3cb; --bg:#faf9f6; --fg:#2c2c2a; --mut:#6b6a65; --acc:#185fa5; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui, -apple-system, sans-serif; color:var(--fg); background:var(--bg); }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px; border-bottom:1px solid var(--bd); background:#fff; flex-wrap:wrap; }
  h1 { font-size:15px; font-weight:600; margin:0; }
  .badge { font-size:12px; color:var(--mut); }
  .spacer { flex:1; }
  button { font:inherit; padding:6px 14px; border:1px solid var(--bd); border-radius:6px; background:#fff; cursor:pointer; font-weight:500; }
  button:hover { background:#f0f0f0; }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  button.primary:hover { background:#134d87; }
  button.link { border:0; background:none; color:var(--mut); font-weight:400; font-size:12px; padding:4px 6px; text-decoration:underline; }
  label { font-size:13px; color:var(--mut); display:flex; align-items:center; gap:5px; cursor:pointer; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--bd); height:52vh; }
  .pane { display:flex; flex-direction:column; background:#fff; min-width:0; }
  .pane h2 { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--mut); margin:0; padding:6px 10px; border-bottom:1px solid var(--bd); }
  textarea { flex:1; border:0; padding:10px; font:13px/1.45 ui-monospace,Menlo,Consolas,monospace; resize:none; outline:none; white-space:pre; overflow:auto; }
  .out { border-top:1px solid var(--bd); background:#fff; height:calc(48vh - 52px); display:flex; flex-direction:column; }
  .out h2 { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--mut); margin:0; padding:6px 10px; border-bottom:1px solid var(--bd); display:flex; justify-content:space-between; }
  pre { margin:0; flex:1; overflow:auto; padding:10px; font:13px/1.45 ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; word-break:break-word; }
  pre.err { color:#a32d2d; background:#fff5f5; }
  .ok { color:#0f6e56; font-weight:600; }

  #gate { position:fixed; inset:0; background:var(--bg); display:none; align-items:center; justify-content:center; z-index:10; }
  #gate.show { display:flex; }
  #gate .card { background:#fff; border:1px solid var(--bd); border-radius:10px; padding:24px; width:320px; }
  #gate h3 { margin:0 0 4px; font-size:15px; font-weight:600; }
  #gate p { margin:0 0 16px; font-size:13px; color:var(--mut); }
  #gate input { width:100%; padding:8px 10px; font:inherit; border:1px solid var(--bd); border-radius:6px; outline:none; }
  #gate input:focus { border-color:var(--acc); }
  #gate button { width:100%; margin-top:12px; }
  #gate .msg { margin-top:10px; font-size:13px; color:#a32d2d; min-height:19px; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h3>Toegang</h3>
    <p>Deze fiddle is met een wachtwoord beveiligd.</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Wachtwoord">
    <label style="margin-top:10px"><input type="checkbox" id="remember"> Onthouden op dit apparaat</label>
    <button class="primary" id="unlock">Ontgrendelen</button>
    <div class="msg" id="gatemsg"></div>
  </div>
</div>

<header>
  <h1>XSLT 3.0 Fiddle</h1>
  <span class="badge">Saxon-JS &middot; Vercel Serverless</span>
  <label><input type="radio" name="mode" value="json" checked> JSON (auto-wrap)</label>
  <label><input type="radio" name="mode" value="xml"> XML</label>
  <label><input type="checkbox" id="auto"> auto</label>
  <button class="primary" id="run">Transform</button>
  <button id="copy">Kopieer output</button>
  <span class="spacer"></span>
  <button class="link" id="logout">Vergrendelen</button>
</header>

<div class="grid">
  <div class="pane">
    <h2>Input</h2>
    <textarea id="src" spellcheck="false" placeholder="Plak hier je JSON of XML..."></textarea>
  </div>
  <div class="pane">
    <h2>Stylesheet</h2>
    <textarea id="xsl" spellcheck="false" placeholder="Plak hier je XSLT stylesheet..."></textarea>
  </div>
</div>

<div class="out">
  <h2><span>Resultaat</span><span id="status"></span></h2>
  <pre id="res"></pre>
</div>

<script>
const src = document.getElementById('src');
const xsl = document.getElementById('xsl');
const res = document.getElementById('res');
const status = document.getElementById('status');
const gate = document.getElementById('gate');
const gatemsg = document.getElementById('gatemsg');
const pw = document.getElementById('pw');

const PW_KEY = 'fiddle.pw';

src.value = localStorage.getItem('fiddle.src') || '';
xsl.value = localStorage.getItem('fiddle.xsl') || '';

function password() { return sessionStorage.getItem(PW_KEY) || localStorage.getItem(PW_KEY) || ''; }

function openGate(msg) {
  gatemsg.textContent = msg || '';
  gate.classList.add('show');
  setTimeout(() => pw.focus(), 50);
}
function closeGate() {
  gate.classList.remove('show');
  pw.value = '';
  gatemsg.textContent = '';
}

function mode() { return document.querySelector('input[name=mode]:checked').value; }

function wrap(text) {
  if (mode() === 'xml') return text;
  return '<?xml version="1.0" encoding="UTF-8"?>\n<payload><![CDATA[\n' + text + '\n]]></payload>';
}

let busy = false;
async function run(silent) {
  if (!password()) { openGate(); return; }
  if (!src.value.trim() || !xsl.value.trim()) {
    if (!silent) {
      res.className = '';
      res.textContent = 'Vul zowel Input als Stylesheet in om te transformeren.';
      status.textContent = '';
    }
    return;
  }
  if (busy) return;
  busy = true;
  status.textContent = 'bezig...';
  localStorage.setItem('fiddle.src', src.value);
  localStorage.setItem('fiddle.xsl', xsl.value);
  try {
    const r = await fetch('/api/transform', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Fiddle-Password': password() },
      body: JSON.stringify({ source: wrap(src.value), xslt: xsl.value })
    });
    const d = await r.json();

    if (r.status === 401) {
      localStorage.removeItem(PW_KEY);
      sessionStorage.removeItem(PW_KEY);
      status.textContent = '';
      busy = false;
      openGate('Wachtwoord klopt niet.');
      return;
    }
    if (r.status === 503) {
      res.className = 'err';
      res.textContent = d.error;
      status.textContent = 'fout';
      busy = false;
      return;
    }

    if (d.ok) {
      res.className = '';
      res.textContent = d.output;
      status.innerHTML = '<span class="ok">ok</span>' + (d.warnings ? ' (met meldingen)' : '');
      if (d.warnings) res.textContent += '\n\n--- meldingen ---\n' + d.warnings;
    } else {
      res.className = 'err';
      res.textContent = d.error + (d.partial ? '\n\n--- gedeeltelijke output ---\n' + d.partial : '');
      status.textContent = 'fout';
    }
  } catch (e) {
    res.className = 'err';
    res.textContent = String(e);
    status.textContent = 'fout';
  }
  busy = false;
}

document.getElementById('unlock').onclick = () => {
  const v = pw.value;
  if (!v) { gatemsg.textContent = 'Vul een wachtwoord in.'; return; }
  sessionStorage.setItem(PW_KEY, v);
  if (document.getElementById('remember') && document.getElementById('remember').checked) {
    localStorage.setItem(PW_KEY, v);
  }
  closeGate();
  run(true);
};

pw.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('unlock').click(); }
});

document.getElementById('logout').onclick = () => {
  localStorage.removeItem(PW_KEY);
  sessionStorage.removeItem(PW_KEY);
  openGate('Vergrendeld.');
};

document.getElementById('run').onclick = () => run(false);
document.getElementById('copy').onclick = () => navigator.clipboard.writeText(res.textContent);

let t;
function maybeAuto() {
  if (!document.getElementById('auto').checked) return;
  clearTimeout(t);
  t = setTimeout(() => run(true), 600);
}
src.addEventListener('input', maybeAuto);
xsl.addEventListener('input', maybeAuto);

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(false); }
});

if (!password()) openGate();
else if (src.value.trim() && xsl.value.trim()) run(true);
</script>
</body>
</html>
